<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le Cadeau</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: sans-serif;
            overflow: hidden; /* Empêche le scroll pendant l'animation */
            cursor: pointer; /* Indique que la page est cliquable */
        }

        /* État initial : Le cadeau */
        #gift-container {
            font-size: 5rem;
            transition: all 0.8s ease-in-out; /* La durée de l'animation */
        }

        /* État final : Le texte */
        #message-container {
            position: absolute;
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s ease-in-out;
        }

        /* Classe active pour déclencher le changement */
        body.opened #gift-container {
            opacity: 0;
            transform: scale(2) rotate(20deg); /* Le cadeau grossit et disparaît */
        }

        body.opened #message-container {
            opacity: 1;
            transform: scale(1); /* Le texte apparaît à sa taille normale */
        }
    </style>
</head>
<body>

    <div id="gift-container">🎁</div>
    <div id="message-container">AVEC TOUS TES DIPLOMES TU CROIS AU CHOSE COMME CA</div>
    <script>
        // On écoute le clic sur tout le corps de la page
        document.body.addEventListener('click', function() {
            // On ajoute la classe qui déclenche les transitions CSS
            this.classList.add('opened');
        });
    </script>
</body>
</html>
